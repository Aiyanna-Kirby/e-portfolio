    <section id="about-me">

        <div class="personal__logo">Aiyanna Smith-Taylor</div>

              <strong class="text--purple">Frontend software developer</strong>

            </p>
            <div class="about-me__links">
              <a href="" class="about-me__link">

              </a>
              <a href="" class="about-me__link">
                <i class="fa-brands fa-github-alt"></i>
              </a>
              <a href="" class="about-me__link">
                <i class="fa-regular fa-envelope"></i>
              </a>
              <a href="" class="about-me__link">

            <img
              src="./assets/undraw_websites.svg"
              class="about-me__img"
              alt=""
            />
